<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Triangle diagram of the CIA triad: confidentiality, integrity, and availability at the three corners, with the note that security needs all three.">
  <!-- background -->
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <!-- triangle connector lines (behind cards) -->
  <g stroke="#cbd5e1" stroke-width="2.5">
    <line x1="480" y1="115" x2="200" y2="385"/>
    <line x1="480" y1="115" x2="760" y2="385"/>
    <line x1="200" y1="385" x2="760" y2="385"/>
  </g>

  <!-- center label -->
  <rect x="360" y="245" width="240" height="40" rx="20" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="270" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">security needs all three</text>

  <!-- CONFIDENTIALITY (top) -->
  <rect x="340" y="30" width="280" height="170" rx="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <g stroke="#1565c0" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 470 60 v-7 a 10 10 0 0 1 20 0 v 7"/>
  </g>
  <rect x="464" y="60" width="32" height="22" rx="4" fill="#1565c0"/>
  <circle cx="480" cy="70" r="3.2" fill="#e3f2fd"/>
  <text x="480" y="110" font-size="18" font-weight="700" fill="#0d47a1" text-anchor="middle">Confidentiality</text>
  <text x="480" y="133" font-size="13" fill="#42586e" text-anchor="middle">Can only authorized people</text>
  <text x="480" y="150" font-size="13" fill="#42586e" text-anchor="middle">see this data?</text>
  <text x="480" y="172" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">Failure: a breach exposes</text>
  <text x="480" y="187" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">customer records</text>

  <!-- INTEGRITY (bottom left) -->
  <rect x="60" y="300" width="280" height="170" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <path d="M 200 312 l 17 7 v 12 c 0 12 -7 19 -17 24 c -10 -5 -17 -12 -17 -24 v -12 z" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <polyline points="192,332 198,338 209,326" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="380" font-size="18" font-weight="700" fill="#1b5e20" text-anchor="middle">Integrity</text>
  <text x="200" y="403" font-size="13" fill="#42586e" text-anchor="middle">Is the data accurate</text>
  <text x="200" y="420" font-size="13" fill="#42586e" text-anchor="middle">and unaltered?</text>
  <text x="200" y="442" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">Failure: grades silently changed</text>
  <text x="200" y="457" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">in the registrar database</text>

  <!-- AVAILABILITY (bottom right) -->
  <rect x="620" y="300" width="280" height="170" rx="14" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <circle cx="760" cy="334" r="17" fill="none" stroke="#ef6c00" stroke-width="2.5"/>
  <g stroke="#ef6c00" stroke-width="2.5" stroke-linecap="round">
    <line x1="760" y1="334" x2="760" y2="324"/>
    <line x1="760" y1="334" x2="768" y2="338"/>
  </g>
  <text x="760" y="380" font-size="18" font-weight="700" fill="#e65100" text-anchor="middle">Availability</text>
  <text x="760" y="403" font-size="13" fill="#42586e" text-anchor="middle">Can authorized people reach it</text>
  <text x="760" y="420" font-size="13" fill="#42586e" text-anchor="middle">when they need it?</text>
  <text x="760" y="442" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">Failure: ransomware locks a</text>
  <text x="760" y="457" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">hospital out of patient files</text>
</svg>
