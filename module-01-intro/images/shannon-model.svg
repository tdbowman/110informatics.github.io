<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Shannon's communication model as a chain: a sender passes a message to an encoder, which sends a signal through a channel to a decoder and on to the receiver. Noise distorts the signal in the channel, and a dashed feedback arrow runs from the receiver back to the sender. Each part is illustrated with a text message example.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="960" height="380" fill="#ffffff"/>

  <!-- NOISE card above the channel -->
  <rect x="404" y="38" width="150" height="56" rx="14" fill="#ffebee" stroke="#ef5350" stroke-width="2"/>
  <text x="479" y="62" font-size="15" font-weight="700" fill="#b71c1c" text-anchor="middle">Noise</text>
  <text x="479" y="80" font-size="11.5" fill="#8c5a5e" text-anchor="middle">interference, typos</text>
  <line x1="479" y1="98" x2="479" y2="144" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- SENDER -->
  <rect x="20" y="150" width="158" height="110" rx="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="99" y="186" font-size="17" font-weight="700" fill="#0d47a1" text-anchor="middle">Sender</text>
  <text x="99" y="212" font-size="12.5" fill="#42586e" text-anchor="middle">you, deciding</text>
  <text x="99" y="229" font-size="12.5" fill="#42586e" text-anchor="middle">what to say</text>

  <line x1="182" y1="205" x2="206" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ENCODER -->
  <rect x="210" y="150" width="158" height="110" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="289" y="186" font-size="17" font-weight="700" fill="#1b5e20" text-anchor="middle">Encoder</text>
  <text x="289" y="212" font-size="12.5" fill="#3f5747" text-anchor="middle">phone turns text</text>
  <text x="289" y="229" font-size="12.5" fill="#3f5747" text-anchor="middle">into radio waves</text>

  <line x1="372" y1="205" x2="396" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CHANNEL -->
  <rect x="400" y="150" width="158" height="110" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="479" y="186" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">Channel</text>
  <text x="479" y="212" font-size="12.5" fill="#475569" text-anchor="middle">the cellular</text>
  <text x="479" y="229" font-size="12.5" fill="#475569" text-anchor="middle">network</text>

  <line x1="562" y1="205" x2="586" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DECODER -->
  <rect x="590" y="150" width="158" height="110" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="669" y="186" font-size="17" font-weight="700" fill="#1b5e20" text-anchor="middle">Decoder</text>
  <text x="669" y="212" font-size="12.5" fill="#3f5747" text-anchor="middle">friend's phone</text>
  <text x="669" y="229" font-size="12.5" fill="#3f5747" text-anchor="middle">renders the text</text>

  <line x1="752" y1="205" x2="776" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RECEIVER -->
  <rect x="780" y="150" width="158" height="110" rx="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="859" y="186" font-size="17" font-weight="700" fill="#0d47a1" text-anchor="middle">Receiver</text>
  <text x="859" y="212" font-size="12.5" fill="#42586e" text-anchor="middle">your friend,</text>
  <text x="859" y="229" font-size="12.5" fill="#42586e" text-anchor="middle">reading it</text>

  <!-- feedback loop -->
  <path d="M 859 264 V 316 H 99 V 270" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="479" y="338" font-size="12.5" fill="#64748b" text-anchor="middle">feedback: the receiver's response flows back (added by later scholars)</text>
</svg>
