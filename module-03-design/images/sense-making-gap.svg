<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Diagram of Dervin's sense-making metaphor. A card on the left labeled your situation, what you know now, is separated by a gap from a card on the right labeled your goal, what you need to know. A bridge card spans the gap, built from the questions you ask, the searches you run, and the people you turn to. A note underneath reads: good design meets people at their gaps.">
  <defs>
    <marker id="arrowsm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="340" fill="#ffffff"/>

  <!-- left: your situation -->
  <rect x="40" y="150" width="270" height="120" rx="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="175" y="188" font-size="18" font-weight="700" fill="#0d47a1" text-anchor="middle">Your situation</text>
  <text x="175" y="213" font-size="13" fill="#42586e" text-anchor="middle">what you know now</text>
  <text x="175" y="236" font-size="12" fill="#5b7288" text-anchor="middle" font-style="italic">(route closed, app changed,</text>
  <text x="175" y="252" font-size="12" fill="#5b7288" text-anchor="middle" font-style="italic">new tool assigned…)</text>

  <!-- right: your goal -->
  <rect x="650" y="150" width="270" height="120" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="785" y="188" font-size="18" font-weight="700" fill="#1b5e20" text-anchor="middle">Your goal</text>
  <text x="785" y="213" font-size="13" fill="#3f5747" text-anchor="middle">what you need to know</text>
  <text x="785" y="236" font-size="12" fill="#5b7288" text-anchor="middle" font-style="italic">(to keep moving</text>
  <text x="785" y="252" font-size="12" fill="#5b7288" text-anchor="middle" font-style="italic">through your day)</text>

  <!-- the gap -->
  <text x="480" y="215" font-size="16" font-weight="700" fill="#b71c1c" text-anchor="middle">the gap</text>
  <text x="480" y="236" font-size="12" fill="#8d3535" text-anchor="middle">between what you know and</text>
  <text x="480" y="252" font-size="12" fill="#8d3535" text-anchor="middle">what you need to know</text>

  <!-- the bridge -->
  <rect x="330" y="56" width="300" height="78" rx="14" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="480" y="84" font-size="16" font-weight="700" fill="#e65100" text-anchor="middle">The bridge you build</text>
  <text x="480" y="106" font-size="12.5" fill="#6b503a" text-anchor="middle">questions you ask · searches you run</text>
  <text x="480" y="123" font-size="12.5" fill="#6b503a" text-anchor="middle">people you turn to</text>

  <!-- flow: situation → bridge → goal -->
  <path d="M 260 150 V 95 H 322" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowsm)"/>
  <path d="M 630 95 H 700 V 142" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowsm)"/>

  <!-- takeaway -->
  <rect x="300" y="288" width="360" height="36" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="311" font-size="13.5" fill="#334155" text-anchor="middle" font-style="italic">good design meets people at their gaps</text>
</svg>
