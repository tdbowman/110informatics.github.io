<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Diagram of the five phases of design thinking: empathize, define, ideate, prototype, and test, connected left to right, with a dashed return path from test looping back to the earlier phases, because testing almost always sends the team back and that is the process working, not failing.">
  <defs>
    <marker id="arrowdt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="340" fill="#ffffff"/>

  <!-- 1. EMPATHIZE -->
  <rect x="24" y="70" width="150" height="140" rx="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <g stroke="#1565c0" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="99" cy="97" r="8"/>
    <path d="M 85 121 Q 99 106 113 121"/>
  </g>
  <text x="99" y="152" font-size="18" font-weight="700" fill="#0d47a1" text-anchor="middle">1. Empathize</text>
  <text x="99" y="176" font-size="13" fill="#42586e" text-anchor="middle">observe &amp; talk</text>
  <text x="99" y="193" font-size="13" fill="#42586e" text-anchor="middle">with real users</text>

  <line x1="178" y1="140" x2="210" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrowdt)"/>

  <!-- 2. DEFINE -->
  <rect x="216" y="70" width="150" height="140" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <g stroke="#2e7d32" stroke-width="2.5" fill="none">
    <circle cx="291" cy="105" r="14"/>
    <circle cx="291" cy="105" r="8"/>
    <circle cx="291" cy="105" r="2.5" fill="#2e7d32" stroke="none"/>
  </g>
  <text x="291" y="152" font-size="18" font-weight="700" fill="#1b5e20" text-anchor="middle">2. Define</text>
  <text x="291" y="176" font-size="13" fill="#3f5747" text-anchor="middle">articulate the</text>
  <text x="291" y="193" font-size="13" fill="#3f5747" text-anchor="middle">real problem</text>

  <line x1="370" y1="140" x2="402" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrowdt)"/>

  <!-- 3. IDEATE -->
  <rect x="408" y="70" width="150" height="140" rx="14" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <g stroke="#ef6c00" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="483" cy="100" r="11"/>
    <line x1="478" y1="115" x2="488" y2="115"/>
    <line x1="479" y1="120" x2="487" y2="120"/>
    <line x1="483" y1="82" x2="483" y2="76"/>
    <line x1="468" y1="87" x2="464" y2="83"/>
    <line x1="498" y1="87" x2="502" y2="83"/>
  </g>
  <text x="483" y="152" font-size="18" font-weight="700" fill="#e65100" text-anchor="middle">3. Ideate</text>
  <text x="483" y="176" font-size="13" fill="#6b503a" text-anchor="middle">brainstorm widely,</text>
  <text x="483" y="193" font-size="13" fill="#6b503a" text-anchor="middle">judge later</text>

  <line x1="562" y1="140" x2="594" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrowdt)"/>

  <!-- 4. PROTOTYPE -->
  <rect x="600" y="70" width="150" height="140" rx="14" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <g stroke="#6a1b9a" stroke-width="2.2" fill="none" stroke-linecap="round">
    <rect x="657" y="88" width="36" height="26" rx="4" stroke-dasharray="5 4"/>
    <line x1="665" y1="108" x2="683" y2="94"/>
  </g>
  <text x="675" y="152" font-size="18" font-weight="700" fill="#4a148c" text-anchor="middle">4. Prototype</text>
  <text x="675" y="176" font-size="13" fill="#54405c" text-anchor="middle">cheap, fast,</text>
  <text x="675" y="193" font-size="13" fill="#54405c" text-anchor="middle">concrete mockups</text>

  <line x1="754" y1="140" x2="786" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrowdt)"/>

  <!-- 5. TEST -->
  <rect x="792" y="70" width="150" height="140" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <g stroke="#475569" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="863" cy="99" r="11"/>
    <line x1="871" y1="107" x2="880" y2="116"/>
    <path d="M 858 99 L 862 103 L 869 95"/>
  </g>
  <text x="867" y="152" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">5. Test</text>
  <text x="867" y="176" font-size="13" fill="#475569" text-anchor="middle">try it with real</text>
  <text x="867" y="193" font-size="13" fill="#475569" text-anchor="middle">users, then loop</text>

  <!-- return loop -->
  <path d="M 867 212 V 272 H 99 V 218" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowdt)"/>
  <path d="M 291 272 V 218" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowdt)"/>
  <path d="M 483 272 V 218" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowdt)"/>
  <text x="483" y="298" font-size="12.5" fill="#64748b" text-anchor="middle">testing almost always sends you back to an earlier phase</text>
  <text x="483" y="316" font-size="12.5" fill="#64748b" text-anchor="middle" font-style="italic">that's the process working, not failing</text>
</svg>
