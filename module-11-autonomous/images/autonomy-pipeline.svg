<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Loop diagram of the autonomy pipeline. Sensors (cameras, radar, LIDAR) feed Perception, where data fusion builds one picture of the world. Perception flows to Localization (where exactly am I, via maps and SLAM), then Planning (route, maneuver, trajectory, prediction), then Control (steering, throttle, braking commands to actuators). A return arrow shows the loop repeating many times per second, and each stage lists how it can fail.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="960" height="370" fill="#ffffff"/>

  <!-- sensor pills feeding in -->
  <g fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5">
    <rect x="18" y="88" width="88" height="28" rx="14"/>
    <rect x="18" y="126" width="88" height="28" rx="14"/>
    <rect x="18" y="164" width="88" height="28" rx="14"/>
  </g>
  <text x="62" y="106" font-size="12.5" fill="#334155" text-anchor="middle">cameras</text>
  <text x="62" y="144" font-size="12.5" fill="#334155" text-anchor="middle">radar</text>
  <text x="62" y="182" font-size="12.5" fill="#334155" text-anchor="middle">LIDAR</text>
  <line x1="110" y1="140" x2="136" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 1 PERCEPTION -->
  <rect x="142" y="60" width="182" height="160" rx="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="233" y="93" font-size="18" font-weight="700" fill="#0d47a1" text-anchor="middle">1. Perception</text>
  <text x="233" y="119" font-size="13" fill="#42586e" text-anchor="middle">sensor data becomes</text>
  <text x="233" y="136" font-size="13" fill="#42586e" text-anchor="middle">a picture of the world</text>
  <text x="233" y="162" font-size="12" fill="#64748b" text-anchor="middle">data fusion merges</text>
  <text x="233" y="177" font-size="12" fill="#64748b" text-anchor="middle">overlapping streams</text>
  <text x="233" y="204" font-size="12" fill="#b71c1c" text-anchor="middle">can misclassify</text>

  <line x1="326" y1="140" x2="352" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 LOCALIZATION -->
  <rect x="358" y="60" width="182" height="160" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="449" y="93" font-size="18" font-weight="700" fill="#1b5e20" text-anchor="middle">2. Localization</text>
  <text x="449" y="119" font-size="13" fill="#3f5747" text-anchor="middle">"where exactly am I?"</text>
  <text x="449" y="136" font-size="13" fill="#3f5747" text-anchor="middle">to the centimeter</text>
  <text x="449" y="162" font-size="12" fill="#64748b" text-anchor="middle">map matching · SLAM</text>
  <text x="449" y="177" font-size="12" fill="#64748b" text-anchor="middle">(GPS alone: meters off)</text>
  <text x="449" y="204" font-size="12" fill="#b71c1c" text-anchor="middle">can drift</text>

  <line x1="542" y1="140" x2="568" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 PLANNING -->
  <rect x="574" y="60" width="182" height="160" rx="14" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="665" y="93" font-size="18" font-weight="700" fill="#e65100" text-anchor="middle">3. Planning</text>
  <text x="665" y="119" font-size="13" fill="#6b503a" text-anchor="middle">route · maneuver ·</text>
  <text x="665" y="136" font-size="13" fill="#6b503a" text-anchor="middle">trajectory</text>
  <text x="665" y="162" font-size="12" fill="#64748b" text-anchor="middle">predicts what others</text>
  <text x="665" y="177" font-size="12" fill="#64748b" text-anchor="middle">will probably do</text>
  <text x="665" y="204" font-size="12" fill="#b71c1c" text-anchor="middle">can freeze</text>

  <line x1="758" y1="140" x2="784" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 CONTROL -->
  <rect x="790" y="60" width="152" height="160" rx="14" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="866" y="93" font-size="18" font-weight="700" fill="#4a148c" text-anchor="middle">4. Control</text>
  <text x="866" y="119" font-size="13" fill="#42586e" text-anchor="middle">commands to</text>
  <text x="866" y="136" font-size="13" fill="#42586e" text-anchor="middle">the actuators</text>
  <text x="866" y="162" font-size="12" fill="#64748b" text-anchor="middle">steering · throttle</text>
  <text x="866" y="177" font-size="12" fill="#64748b" text-anchor="middle">· braking</text>
  <text x="866" y="204" font-size="12" fill="#b71c1c" text-anchor="middle">can react too slowly</text>

  <!-- return loop -->
  <path d="M 866 224 V 292 H 233 V 230" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="550" y="283" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">the loop repeats many times per second</text>

  <!-- footer note -->
  <text x="480" y="336" font-size="12.5" fill="#64748b" text-anchor="middle">same cycle in a Mars rover, a warehouse robot, and a robotaxi; what differs is how messy each stage's problem is</text>
</svg>
