<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Staircase diagram of the six SAE levels of driving automation, from Level 0, no automation, up to Level 5, full automation, which does not exist yet. A bracket marks Levels 0 to 2 as human responsible and supervising, and Levels 3 to 5 as system drives in widening conditions, with the critical break between Levels 2 and 3.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>

  <!-- Level 0 -->
  <rect x="20" y="240" width="140" height="150" rx="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="90" y="272" font-size="24" font-weight="700" fill="#0d47a1" text-anchor="middle">0</text>
  <text x="90" y="294" font-size="13.5" font-weight="700" fill="#0d47a1" text-anchor="middle">No Automation</text>
  <text x="90" y="318" font-size="12" fill="#42586e" text-anchor="middle">human does</text>
  <text x="90" y="333" font-size="12" fill="#42586e" text-anchor="middle">everything</text>
  <text x="90" y="362" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">traditional car</text>

  <!-- Level 1 -->
  <rect x="172" y="205" width="140" height="150" rx="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="242" y="237" font-size="24" font-weight="700" fill="#0d47a1" text-anchor="middle">1</text>
  <text x="242" y="259" font-size="13.5" font-weight="700" fill="#0d47a1" text-anchor="middle">Driver Assistance</text>
  <text x="242" y="283" font-size="12" fill="#42586e" text-anchor="middle">system assists</text>
  <text x="242" y="298" font-size="12" fill="#42586e" text-anchor="middle">with one task</text>
  <text x="242" y="327" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">cruise control</text>

  <!-- Level 2 -->
  <rect x="324" y="170" width="140" height="150" rx="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="394" y="202" font-size="24" font-weight="700" fill="#0d47a1" text-anchor="middle">2</text>
  <text x="394" y="224" font-size="13.5" font-weight="700" fill="#0d47a1" text-anchor="middle">Partial Automation</text>
  <text x="394" y="248" font-size="12" fill="#42586e" text-anchor="middle">multiple tasks,</text>
  <text x="394" y="263" font-size="12" fill="#42586e" text-anchor="middle">human supervises</text>
  <text x="394" y="292" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">Tesla Autopilot /</text>
  <text x="394" y="307" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">"FSD (Supervised)"</text>

  <!-- critical break divider -->
  <line x1="490" y1="60" x2="490" y2="400" stroke="#ef5350" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="490" y="44" font-size="12.5" font-weight="700" fill="#b71c1c" text-anchor="middle">the critical break</text>

  <!-- Level 3 -->
  <rect x="516" y="135" width="140" height="150" rx="14" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="586" y="167" font-size="24" font-weight="700" fill="#e65100" text-anchor="middle">3</text>
  <text x="586" y="189" font-size="13.5" font-weight="700" fill="#e65100" text-anchor="middle">Conditional</text>
  <text x="586" y="213" font-size="12" fill="#6b503a" text-anchor="middle">most driving, in</text>
  <text x="586" y="228" font-size="12" fill="#6b503a" text-anchor="middle">certain conditions</text>
  <text x="586" y="257" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">traffic jam pilot</text>

  <!-- Level 4 -->
  <rect x="668" y="100" width="140" height="150" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="738" y="132" font-size="24" font-weight="700" fill="#1b5e20" text-anchor="middle">4</text>
  <text x="738" y="154" font-size="13.5" font-weight="700" fill="#1b5e20" text-anchor="middle">High Automation</text>
  <text x="738" y="178" font-size="12" fill="#3f5747" text-anchor="middle">all driving, in</text>
  <text x="738" y="193" font-size="12" fill="#3f5747" text-anchor="middle">defined conditions</text>
  <text x="738" y="222" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">Waymo robotaxi</text>

  <!-- Level 5 -->
  <rect x="820" y="65" width="140" height="150" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="890" y="97" font-size="24" font-weight="700" fill="#334155" text-anchor="middle">5</text>
  <text x="890" y="119" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">Full Automation</text>
  <text x="890" y="143" font-size="12" fill="#42586e" text-anchor="middle">all driving, in</text>
  <text x="890" y="158" font-size="12" fill="#42586e" text-anchor="middle">all conditions</text>
  <text x="890" y="187" font-size="12" font-style="italic" fill="#64748b" text-anchor="middle">doesn't exist yet</text>

  <!-- brackets -->
  <path d="M 20 415 V 427 H 464 V 415" fill="none" stroke="#2196f3" stroke-width="2"/>
  <text x="242" y="450" font-size="13" font-weight="700" fill="#0d47a1" text-anchor="middle">human is responsible: must supervise</text>

  <path d="M 516 415 V 427 H 960 V 415" fill="none" stroke="#4caf50" stroke-width="2"/>
  <text x="738" y="450" font-size="13" font-weight="700" fill="#1b5e20" text-anchor="middle">system drives, in widening conditions</text>

  <!-- rising arrow annotation -->
  <line x1="80" y1="215" x2="300" y2="140" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="90" y="118" font-size="12.5" fill="#64748b">more autonomy, fewer human duties</text>
</svg>
