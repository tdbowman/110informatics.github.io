<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Diagram distinguishing automated systems, autonomous systems, and AI. Automated systems execute a fixed procedure and replace human muscle; autonomous systems handle uncertainty and replace human judgment; AI is a family of techniques many autonomous systems use, not a synonym for either.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>

  <!-- AUTOMATED card -->
  <rect x="50" y="40" width="370" height="240" rx="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <!-- gear icon -->
  <g transform="translate(95,80)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#1565c0" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#1565c0"/>
    <g stroke="#1565c0" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-18" x2="0" y2="-23"/>
      <line x1="0" y1="18" x2="0" y2="23"/>
      <line x1="-18" y1="0" x2="-23" y2="0"/>
      <line x1="18" y1="0" x2="23" y2="0"/>
      <line x1="13" y1="13" x2="16.5" y2="16.5"/>
      <line x1="-13" y1="13" x2="-16.5" y2="16.5"/>
      <line x1="13" y1="-13" x2="16.5" y2="-16.5"/>
      <line x1="-13" y1="-13" x2="-16.5" y2="-16.5"/>
    </g>
  </g>
  <text x="140" y="87" font-size="19" font-weight="700" fill="#0d47a1">Automated</text>
  <text x="80" y="130" font-size="13.5" fill="#42586e">Executes a <tspan font-weight="700">fixed procedure</tspan> in a</text>
  <text x="80" y="148" font-size="13.5" fill="#42586e">controlled environment, the same</text>
  <text x="80" y="166" font-size="13.5" fill="#42586e">action, every time.</text>
  <text x="80" y="196" font-size="13.5" font-weight="700" fill="#0d47a1">Replaces human muscle</text>
  <text x="80" y="222" font-size="12.5" font-style="italic" fill="#64748b">dishwasher · traffic light on a timer</text>
  <text x="80" y="252" font-size="12.5" fill="#b71c1c">surprise it, and it fails (or keeps welding)</text>

  <!-- arrow between -->
  <line x1="428" y1="160" x2="532" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="132" font-size="12.5" fill="#64748b" text-anchor="middle">the harder, more</text>
  <text x="480" y="148" font-size="12.5" fill="#64748b" text-anchor="middle">consequential step</text>

  <!-- AUTONOMOUS card -->
  <rect x="540" y="40" width="370" height="240" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <!-- sense-decide-act mini loop icon -->
  <g transform="translate(585,80)" fill="none" stroke="#2e7d32" stroke-width="2.5">
    <path d="M -12 6 A 14 14 0 1 1 14 4" stroke-linecap="round"/>
    <path d="M 9 -1 L 14 4 L 19 -2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="630" y="87" font-size="19" font-weight="700" fill="#1b5e20">Autonomous</text>
  <text x="570" y="130" font-size="13.5" fill="#3f5747">Handles <tspan font-weight="700">uncertainty</tspan>: senses what is</text>
  <text x="570" y="148" font-size="13.5" fill="#3f5747">happening, decides among options,</text>
  <text x="570" y="166" font-size="13.5" fill="#3f5747">acts, and adjusts as things change.</text>
  <text x="570" y="196" font-size="13.5" font-weight="700" fill="#1b5e20">Replaces human judgment</text>
  <text x="570" y="222" font-size="12.5" font-style="italic" fill="#64748b">robot vacuum · Mars rover</text>
  <text x="570" y="252" font-size="12.5" fill="#3f5747">the module's questions live here</text>

  <!-- AI card -->
  <rect x="170" y="330" width="620" height="110" rx="14" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <!-- chip icon -->
  <g transform="translate(215,385)">
    <rect x="-14" y="-14" width="28" height="28" rx="5" fill="none" stroke="#6a1b9a" stroke-width="2.5"/>
    <g stroke="#6a1b9a" stroke-width="2" stroke-linecap="round">
      <line x1="-7" y1="-14" x2="-7" y2="-21"/>
      <line x1="0" y1="-14" x2="0" y2="-21"/>
      <line x1="7" y1="-14" x2="7" y2="-21"/>
      <line x1="-7" y1="14" x2="-7" y2="21"/>
      <line x1="0" y1="14" x2="0" y2="21"/>
      <line x1="7" y1="14" x2="7" y2="21"/>
    </g>
  </g>
  <text x="250" y="365" font-size="18" font-weight="700" fill="#4a148c">AI: a toolkit, not a synonym</text>
  <text x="250" y="390" font-size="13" fill="#42586e">A family of techniques (machine learning above all) that many autonomous</text>
  <text x="250" y="408" font-size="13" fill="#42586e">systems use to achieve autonomy.</text>
  <text x="250" y="430" font-size="12" font-style="italic" fill="#64748b">chess program: AI, no physical autonomy · old thermostat: a bit autonomous, no AI</text>

  <!-- arrow from AI up to Autonomous -->
  <path d="M 700 328 V 288" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="712" y="312" font-size="12" fill="#64748b">often enables</text>
</svg>
