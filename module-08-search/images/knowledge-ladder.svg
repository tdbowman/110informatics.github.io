<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Staircase diagram of knowledge organization systems from metadata at the bottom to ontologies at the top. Precision and cost both increase as you climb. Folksonomies float off to the side as the unstructured, user-tagged approach.">
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- rising axis annotation -->
  <line x1="70" y1="440" x2="70" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="52" y="270" font-size="14" font-weight="600" fill="#475569" text-anchor="middle" transform="rotate(-90 52 270)">precision &amp; consistency</text>
  <line x1="110" y1="470" x2="700 " y2="470" stroke="#64748b" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="405" y="496" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">cost to build and maintain</text>

  <!-- steps: 6 rungs -->
  <!-- step blocks ascend left to right -->
  <g font-size="15.5" font-weight="700">
    <rect x="110" y="390" width="150" height="52" rx="10" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
    <text x="185" y="413" fill="#0d47a1" text-anchor="middle">Metadata</text>
    <text x="185" y="431" font-size="12" font-weight="400" fill="#42586e" text-anchor="middle">data about data</text>

    <rect x="212" y="330" width="150" height="52" rx="10" fill="#e0f2f1" stroke="#26a69a" stroke-width="2"/>
    <text x="287" y="353" fill="#00695c" text-anchor="middle">Synonym rings</text>
    <text x="287" y="371" font-size="12" font-weight="400" fill="#3f5e5a" text-anchor="middle">car = auto = automobile</text>

    <rect x="314" y="270" width="164" height="52" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
    <text x="396" y="293" fill="#1b5e20" text-anchor="middle">Controlled vocabulary</text>
    <text x="396" y="311" font-size="12" font-weight="400" fill="#3f5747" text-anchor="middle">approved terms, BT / NT</text>

    <rect x="430" y="210" width="150" height="52" rx="10" fill="#fff8e1" stroke="#ffc107" stroke-width="2"/>
    <text x="505" y="233" fill="#8d6e00" text-anchor="middle">Taxonomy</text>
    <text x="505" y="251" font-size="12" font-weight="400" fill="#6d5c2e" text-anchor="middle">full hierarchy of categories</text>

    <rect x="532" y="150" width="150" height="52" rx="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="607" y="173" fill="#e65100" text-anchor="middle">Authority files</text>
    <text x="607" y="191" font-size="12" font-weight="400" fill="#6b503a" text-anchor="middle">one official name each</text>

    <rect x="634" y="90" width="150" height="52" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
    <text x="709" y="113" fill="#4a148c" text-anchor="middle">Ontology</text>
    <text x="709" y="131" font-size="12" font-weight="400" fill="#54405c" text-anchor="middle">concepts + relationships</text>
  </g>

  <!-- connecting risers -->
  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4">
    <line x1="260" y1="390" x2="260" y2="382"/>
    <line x1="362" y1="330" x2="362" y2="322"/>
    <line x1="464" y1="270" x2="464" y2="262"/>
    <line x1="566" y1="210" x2="566" y2="202"/>
    <line x1="668" y1="150" x2="668" y2="142"/>
  </g>

  <!-- folksonomy floater -->
  <g transform="rotate(-4 830 330)">
    <rect x="756" y="296" width="150" height="70" rx="18" fill="#fce4ec" stroke="#ec407a" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="831" y="323" font-size="15.5" font-weight="700" fill="#880e4f" text-anchor="middle">Folksonomy</text>
    <text x="831" y="341" font-size="12" fill="#7c4b5e" text-anchor="middle">user tags, no control</text>
    <text x="831" y="357" font-size="12" fill="#7c4b5e" text-anchor="middle">#thrifting #fyp</text>
  </g>
  <text x="831" y="392" font-size="12" fill="#ad6b83" text-anchor="middle" font-style="italic">the ladder's free-spirited cousin:</text>
  <text x="831" y="408" font-size="12" fill="#ad6b83" text-anchor="middle" font-style="italic">nearly free, wildly inconsistent</text>

  <text x="480" y="40" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">The ladder of knowledge organization</text>
</svg>
