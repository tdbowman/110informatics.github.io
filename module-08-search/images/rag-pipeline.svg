<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Diagram of retrieval-augmented generation: a question goes to a retrieval system, which finds documents; a language model then generates an answer grounded in those documents. A warning notes that when retrieval fails, the model guesses, which is one source of hallucination.">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c62828"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="360" fill="#ffffff"/>

  <!-- question -->
  <rect x="20" y="96" width="192" height="78" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="116" y="128" font-size="15.5" font-weight="700" fill="#334155" text-anchor="middle">Your question</text>
  <text x="116" y="151" font-size="12" fill="#64748b" text-anchor="middle" font-style="italic">"Is octopus RNA editing real?"</text>

  <line x1="212" y1="135" x2="252" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- retrieve -->
  <rect x="260" y="62" width="212" height="146" rx="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <g transform="translate(305,96)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#1565c0" stroke-width="2.5"/>
    <line x1="8.5" y1="8.5" x2="18" y2="18" stroke="#1565c0" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="338" y="103" font-size="18" font-weight="700" fill="#0d47a1">1. Retrieve</text>
  <text x="366" y="140" font-size="13" fill="#42586e" text-anchor="middle">a classic IR system finds</text>
  <text x="366" y="158" font-size="13" fill="#42586e" text-anchor="middle">documents relevant to you</text>
  <text x="366" y="182" font-size="12" fill="#5b7288" text-anchor="middle" font-style="italic">(search index / vector database)</text>

  <line x1="472" y1="135" x2="512" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- retrieved docs -->
  <g stroke="#90a4ae" stroke-width="1.5" fill="#ffffff">
    <rect x="522" y="94" width="56" height="70" rx="6"/>
    <rect x="532" y="104" width="56" height="70" rx="6"/>
    <rect x="542" y="114" width="56" height="70" rx="6"/>
  </g>
  <g stroke="#b0bec5" stroke-width="2" stroke-linecap="round">
    <line x1="552" y1="132" x2="586" y2="132"/>
    <line x1="552" y1="146" x2="578" y2="146"/>
    <line x1="552" y1="160" x2="586" y2="160"/>
  </g>
  <text x="560" y="208" font-size="12.5" fill="#64748b" text-anchor="middle">retrieved docs</text>

  <line x1="610" y1="135" x2="650" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- generate -->
  <rect x="658" y="62" width="212" height="146" rx="14" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <g transform="translate(688,80)" stroke="#6a1b9a" stroke-width="2.2" stroke-linecap="round" fill="none">
    <rect x="0" y="10" width="30" height="26" rx="6"/>
    <circle cx="9" cy="21" r="2.3" fill="#6a1b9a" stroke="none"/>
    <circle cx="21" cy="21" r="2.3" fill="#6a1b9a" stroke="none"/>
    <line x1="10" y1="30" x2="20" y2="30"/>
    <line x1="15" y1="10" x2="15" y2="4"/>
    <circle cx="15" cy="2" r="2.3" fill="#6a1b9a" stroke="none"/>
  </g>
  <text x="732" y="103" font-size="18" font-weight="700" fill="#4a148c">2. Generate</text>
  <text x="764" y="140" font-size="13" fill="#54405c" text-anchor="middle">an AI model writes the answer</text>
  <text x="764" y="158" font-size="13" font-weight="700" font-style="italic" fill="#54405c" text-anchor="middle">from those documents</text>
  <text x="764" y="182" font-size="12" fill="#776380" text-anchor="middle" font-style="italic">(grounded, not guessed)</text>

  <!-- answer -->
  <path d="M 764 208 V 244" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow3)"/>
  <rect x="640" y="252" width="248" height="76" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="764" y="284" font-size="15.5" font-weight="700" fill="#1b5e20" text-anchor="middle">Grounded answer</text>
  <text x="764" y="307" font-size="13" fill="#3f5747" text-anchor="middle">with citations back to sources</text>

  <!-- hallucination warning -->
  <path d="M 366 208 V 285 H 400" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow3r)"/>
  <rect x="400" y="250" width="216" height="70" rx="10" fill="#ffebee" stroke="#ef5350" stroke-width="1.5"/>
  <text x="508" y="273" font-size="12" font-weight="700" fill="#b71c1c" text-anchor="middle">when retrieval fails,</text>
  <text x="508" y="291" font-size="12" fill="#8d3535" text-anchor="middle">the model fills the gap by guessing</text>
  <text x="508" y="309" font-size="12" fill="#8d3535" text-anchor="middle">one source of "hallucination"</text>
</svg>
