<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Diagram of the six components of an information system. Hardware, software, and networks form the technical half; data, procedures, and people form the human half. All six feed into one working information system, and a failure of people or procedures looks just like a technical failure.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>

  <!-- group labels -->
  <text x="255" y="36" font-size="14.5" font-weight="700" fill="#0d47a1" text-anchor="middle">THE TECHNICAL HALF</text>
  <line x1="60" y1="48" x2="450" y2="48" stroke="#90caf9" stroke-width="2" stroke-linecap="round"/>
  <text x="705" y="36" font-size="14.5" font-weight="700" fill="#1b5e20" text-anchor="middle">THE HUMAN HALF</text>
  <line x1="510" y1="48" x2="900" y2="48" stroke="#a5d6a7" stroke-width="2" stroke-linecap="round"/>

  <!-- technical cards (blue) -->
  <rect x="37" y="64" width="136" height="118" rx="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="105" y="103" font-size="16" font-weight="700" fill="#0d47a1" text-anchor="middle">Hardware</text>
  <text x="105" y="128" font-size="12" fill="#42586e" text-anchor="middle">servers, phones,</text>
  <text x="105" y="145" font-size="12" fill="#42586e" text-anchor="middle">chips, switches</text>

  <rect x="187" y="64" width="136" height="118" rx="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="255" y="103" font-size="16" font-weight="700" fill="#0d47a1" text-anchor="middle">Software</text>
  <text x="255" y="128" font-size="12" fill="#42586e" text-anchor="middle">the programs that</text>
  <text x="255" y="145" font-size="12" fill="#42586e" text-anchor="middle">run the hardware</text>

  <rect x="337" y="64" width="136" height="118" rx="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="405" y="103" font-size="16" font-weight="700" fill="#0d47a1" text-anchor="middle">Networks</text>
  <text x="405" y="128" font-size="12" fill="#42586e" text-anchor="middle">the connections</text>
  <text x="405" y="145" font-size="12" fill="#42586e" text-anchor="middle">that link it all</text>

  <!-- human cards (green) -->
  <rect x="487" y="64" width="136" height="118" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="555" y="103" font-size="16" font-weight="700" fill="#1b5e20" text-anchor="middle">Data</text>
  <text x="555" y="128" font-size="12" fill="#3f5747" text-anchor="middle">the raw facts, stored</text>
  <text x="555" y="145" font-size="12" fill="#3f5747" text-anchor="middle">and processed</text>

  <rect x="637" y="64" width="136" height="118" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="705" y="103" font-size="16" font-weight="700" fill="#1b5e20" text-anchor="middle">Procedures</text>
  <text x="705" y="128" font-size="12" fill="#3f5747" text-anchor="middle">the rules and steps</text>
  <text x="705" y="145" font-size="12" fill="#3f5747" text-anchor="middle">everyone follows</text>

  <rect x="787" y="64" width="136" height="118" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="855" y="103" font-size="16" font-weight="700" fill="#1b5e20" text-anchor="middle">People</text>
  <text x="855" y="128" font-size="12" fill="#3f5747" text-anchor="middle">those who build,</text>
  <text x="855" y="145" font-size="12" fill="#3f5747" text-anchor="middle">run, and use it</text>

  <!-- arrows into the system card -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="105" y1="190" x2="105" y2="230" marker-end="url(#arrow)"/>
    <line x1="255" y1="190" x2="255" y2="230" marker-end="url(#arrow)"/>
    <line x1="405" y1="190" x2="405" y2="230" marker-end="url(#arrow)"/>
    <line x1="555" y1="190" x2="555" y2="230" marker-end="url(#arrow)"/>
    <line x1="705" y1="190" x2="705" y2="230" marker-end="url(#arrow)"/>
    <line x1="855" y1="190" x2="855" y2="230" marker-end="url(#arrow)"/>
  </g>

  <!-- system card -->
  <rect x="70" y="240" width="820" height="112" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="480" y="280" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">One working information system</text>
  <text x="480" y="306" font-size="13" fill="#42586e" text-anchor="middle">Every component has to work for the system to work. When &#8220;the system is down,&#8221;</text>
  <text x="480" y="326" font-size="13" fill="#42586e" text-anchor="middle">the culprit may be people or procedures wearing a technical disguise.</text>
</svg>
