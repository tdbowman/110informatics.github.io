<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Diagram of sim-to-real transfer: a game engine simulates a world with realistic physics, a robot practices there at massive scale where failures are free, and the learned skills transfer to a physical robot. A dashed warning arrow loops back from reality to the simulator, labeled the reality gap: the messy world never quite matches the sim.">
  <defs>
    <marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowSr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c62828"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="400" fill="#ffffff"/>

  <!-- 1. SIMULATE card (blue) -->
  <rect x="40" y="56" width="240" height="154" rx="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <!-- game-window icon -->
  <g transform="translate(132,74)" stroke="#1565c0" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="56" height="38" rx="5"/>
    <path d="M 5 30 L 18 16 L 28 26 L 38 12 L 51 30"/>
    <circle cx="43" cy="9" r="3"/>
  </g>
  <text x="160" y="142" font-size="18" font-weight="700" fill="#0d47a1" text-anchor="middle">1. Simulate</text>
  <text x="160" y="164" font-size="13" fill="#42586e" text-anchor="middle">a game engine renders a</text>
  <text x="160" y="181" font-size="13" fill="#42586e" text-anchor="middle">world with realistic physics</text>
  <text x="160" y="200" font-size="12" fill="#5b7288" font-style="italic" text-anchor="middle">(Unity, Unreal, physics sims)</text>

  <line x1="286" y1="133" x2="348" y2="133" stroke="#64748b" stroke-width="2" marker-end="url(#arrowS)"/>

  <!-- 2. PRACTICE card (green) -->
  <rect x="356" y="56" width="248" height="154" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <!-- reset-loop icon -->
  <g transform="translate(452,93)" stroke="#2e7d32" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M 24 -14 A 17 17 0 1 1 4 -10"/>
    <path d="M 24 -22 L 25 -13 L 16 -12" fill="none"/>
  </g>
  <text x="480" y="142" font-size="18" font-weight="700" fill="#1b5e20" text-anchor="middle">2. Practice at scale</text>
  <text x="480" y="164" font-size="13" fill="#3f5747" text-anchor="middle">millions of attempts overnight;</text>
  <text x="480" y="181" font-size="13" fill="#3f5747" text-anchor="middle">failures are free, resets instant</text>
  <text x="480" y="200" font-size="12" fill="#5b7288" font-style="italic" text-anchor="middle">(nightmare scenarios on demand)</text>

  <line x1="610" y1="133" x2="672" y2="133" stroke="#64748b" stroke-width="2" marker-end="url(#arrowS)"/>
  <text x="641" y="120" font-size="12" fill="#64748b" text-anchor="middle">skills</text>

  <!-- 3. TRANSFER card (orange) -->
  <rect x="680" y="56" width="240" height="154" rx="14" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <!-- robot-head icon -->
  <g transform="translate(785,72)" stroke="#e65100" stroke-width="2.2" stroke-linecap="round" fill="none">
    <rect x="0" y="10" width="30" height="26" rx="6"/>
    <circle cx="9" cy="21" r="2.3" fill="#e65100" stroke="none"/>
    <circle cx="21" cy="21" r="2.3" fill="#e65100" stroke="none"/>
    <line x1="10" y1="30" x2="20" y2="30"/>
    <line x1="15" y1="10" x2="15" y2="4"/>
    <circle cx="15" cy="2" r="2.3" fill="#e65100" stroke="none"/>
  </g>
  <text x="800" y="142" font-size="18" font-weight="700" fill="#e65100" text-anchor="middle">3. Transfer to reality</text>
  <text x="800" y="164" font-size="13" fill="#6b503a" text-anchor="middle">learned skills move to the</text>
  <text x="800" y="181" font-size="13" fill="#6b503a" text-anchor="middle">physical robot</text>
  <text x="800" y="200" font-size="12" fill="#5b7288" font-style="italic" text-anchor="middle">("sim-to-real transfer")</text>

  <!-- reality gap loop back -->
  <path d="M 800 218 V 320 H 160 V 226" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowSr)"/>
  <rect x="318" y="284" width="324" height="72" rx="10" fill="#ffebee" stroke="#ef5350" stroke-width="1.5"/>
  <text x="480" y="308" font-size="12.5" font-weight="700" fill="#b71c1c" text-anchor="middle">the "reality gap"</text>
  <text x="480" y="326" font-size="12" fill="#8d3535" text-anchor="middle">the messy world never quite matches the sim;</text>
  <text x="480" y="343" font-size="12" fill="#8d3535" text-anchor="middle">Moravec's paradox meets you on the way out</text>
</svg>
