<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Diagram of the curb-cut effect. Curb cuts, won by disability activists so wheelchair users could cross the street, are now used by nearly everyone: parents with strollers, travelers with luggage, delivery workers, kids on bikes, and older adults. Below, the same pattern in technology: captions built for Deaf viewers now serve noisy gyms and language learners; text-to-speech built for blind users became audiobooks and voice assistants; OXO Good Grips designed for arthritic hands took over everyone's kitchens.">
  <defs>
    <marker id="arrowcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- won for one group -->
  <rect x="40" y="30" width="340" height="180" rx="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="210" y="64" font-size="18" font-weight="700" fill="#0d47a1" text-anchor="middle">Won for one group</text>
  <text x="210" y="94" font-size="13" fill="#42586e" text-anchor="middle">Curb cuts: ramps carved into</text>
  <text x="210" y="113" font-size="13" fill="#42586e" text-anchor="middle">street corners, fought for by</text>
  <text x="210" y="132" font-size="13" fill="#42586e" text-anchor="middle">disability activists (Berkeley,</text>
  <text x="210" y="151" font-size="13" fill="#42586e" text-anchor="middle">1970s) so wheelchair users</text>
  <text x="210" y="170" font-size="13" fill="#42586e" text-anchor="middle">could cross the street</text>

  <line x1="388" y1="120" x2="432" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrowcc)"/>

  <!-- used by everyone -->
  <rect x="440" y="30" width="480" height="180" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="680" y="64" font-size="18" font-weight="700" fill="#1b5e20" text-anchor="middle">…used by nearly everyone</text>
  <text x="470" y="102" font-size="13" fill="#3f5747">• parents with strollers</text>
  <text x="470" y="128" font-size="13" fill="#3f5747">• travelers with luggage</text>
  <text x="470" y="154" font-size="13" fill="#3f5747">• delivery workers with carts</text>
  <text x="712" y="102" font-size="13" fill="#3f5747">• kids on bikes</text>
  <text x="712" y="128" font-size="13" fill="#3f5747">• older adults who like the</text>
  <text x="722" y="146" font-size="13" fill="#3f5747">gentler transition</text>

  <!-- divider -->
  <line x1="40" y1="246" x2="920" y2="246" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="480" y="274" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">The same pattern, in technology</text>

  <!-- column A: captions -->
  <rect x="40" y="296" width="280" height="88" rx="14" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="180" y="330" font-size="15.5" font-weight="700" fill="#4a148c" text-anchor="middle">Captions</text>
  <text x="180" y="354" font-size="12.5" fill="#54405c" text-anchor="middle">built for Deaf viewers</text>
  <line x1="180" y1="392" x2="180" y2="422" stroke="#64748b" stroke-width="2" marker-end="url(#arrowcc)"/>
  <rect x="40" y="430" width="280" height="70" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="180" y="459" font-size="12.5" fill="#3f5747" text-anchor="middle">noisy gyms, quiet libraries,</text>
  <text x="180" y="479" font-size="12.5" fill="#3f5747" text-anchor="middle">language learners</text>

  <!-- column B: text-to-speech -->
  <rect x="340" y="296" width="280" height="88" rx="14" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="480" y="330" font-size="15.5" font-weight="700" fill="#4a148c" text-anchor="middle">Text-to-speech</text>
  <text x="480" y="354" font-size="12.5" fill="#54405c" text-anchor="middle">built for blind users</text>
  <line x1="480" y1="392" x2="480" y2="422" stroke="#64748b" stroke-width="2" marker-end="url(#arrowcc)"/>
  <rect x="340" y="430" width="280" height="70" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="480" y="459" font-size="12.5" fill="#3f5747" text-anchor="middle">audiobooks and</text>
  <text x="480" y="479" font-size="12.5" fill="#3f5747" text-anchor="middle">voice assistants</text>

  <!-- column C: OXO -->
  <rect x="640" y="296" width="280" height="88" rx="14" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="780" y="330" font-size="15.5" font-weight="700" fill="#4a148c" text-anchor="middle">OXO Good Grips</text>
  <text x="780" y="354" font-size="12.5" fill="#54405c" text-anchor="middle">designed for arthritic hands</text>
  <line x1="780" y1="392" x2="780" y2="422" stroke="#64748b" stroke-width="2" marker-end="url(#arrowcc)"/>
  <rect x="640" y="430" width="280" height="70" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="780" y="459" font-size="12.5" fill="#3f5747" text-anchor="middle">everyone's kitchen</text>
  <text x="780" y="479" font-size="12.5" fill="#3f5747" text-anchor="middle">drawers</text>
</svg>
