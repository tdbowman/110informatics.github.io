<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Diagram of the needs-driven visualization workflow: identify the stakeholder's question, acquire and prepare data, analyze it, design the visualization, then deploy and interpret with the user. A dashed arrow loops from the last step back to the first, showing that the process is iterative.">
  <defs>
    <marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>

  <!-- 1. The question -->
  <rect x="40" y="60" width="260" height="118" rx="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="170" y="96" font-size="18" font-weight="700" fill="#0d47a1" text-anchor="middle">1. The question</text>
  <text x="170" y="126" font-size="13" fill="#42586e" text-anchor="middle">who is the stakeholder, and what</text>
  <text x="170" y="144" font-size="13" fill="#42586e" text-anchor="middle">do they need to know?</text>

  <line x1="300" y1="119" x2="342" y2="119" stroke="#64748b" stroke-width="2" marker-end="url(#arrowW)"/>

  <!-- 2. The data -->
  <rect x="350" y="60" width="260" height="118" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="480" y="96" font-size="18" font-weight="700" fill="#1b5e20" text-anchor="middle">2. The data</text>
  <text x="480" y="126" font-size="13" fill="#3f5747" text-anchor="middle">acquire and prepare data that</text>
  <text x="480" y="144" font-size="13" fill="#3f5747" text-anchor="middle">can actually answer it</text>

  <line x1="610" y1="119" x2="652" y2="119" stroke="#64748b" stroke-width="2" marker-end="url(#arrowW)"/>

  <!-- 3. Analyze -->
  <rect x="660" y="60" width="260" height="118" rx="14" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="790" y="96" font-size="18" font-weight="700" fill="#e65100" text-anchor="middle">3. Analyze</text>
  <text x="790" y="126" font-size="13" fill="#6b503a" text-anchor="middle">statistical &#183; temporal &#183; geospatial</text>
  <text x="790" y="144" font-size="13" fill="#6b503a" text-anchor="middle">topical &#183; network</text>

  <line x1="790" y1="178" x2="790" y2="244" stroke="#64748b" stroke-width="2" marker-end="url(#arrowW)"/>

  <!-- 4. Design -->
  <rect x="660" y="252" width="260" height="118" rx="14" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="790" y="288" font-size="18" font-weight="700" fill="#4a148c" text-anchor="middle">4. Design</text>
  <text x="790" y="318" font-size="13" fill="#54405c" text-anchor="middle">choose encodings that make the</text>
  <text x="790" y="336" font-size="13" fill="#54405c" text-anchor="middle">answer visible at a glance</text>

  <line x1="660" y1="311" x2="618" y2="311" stroke="#64748b" stroke-width="2" marker-end="url(#arrowW)"/>

  <!-- 5. Deploy & interpret -->
  <rect x="350" y="252" width="260" height="118" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="480" y="288" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">5. Deploy &amp; interpret</text>
  <text x="480" y="318" font-size="13" fill="#42586e" text-anchor="middle">show the user &#8212; then watch what</text>
  <text x="480" y="336" font-size="13" fill="#42586e" text-anchor="middle">they actually do with it</text>

  <!-- iterate loop back to step 1 -->
  <path d="M 350 311 H 170 V 186" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowW)"/>
  <text x="230" y="338" font-size="12.5" font-style="italic" fill="#64748b" text-anchor="middle">iterate: version one teaches</text>
  <text x="230" y="356" font-size="12.5" font-style="italic" fill="#64748b" text-anchor="middle">you what version two should be</text>
</svg>
