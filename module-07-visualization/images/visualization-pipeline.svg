<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Diagram of Ware's visualization pipeline: data is collected and stored, then preprocessed and transformed, then mapped to visual marks on a screen, and finally perceived by a human viewer. Dashed feedback arrows run from the human back to the transform and mapping stages, showing that the viewer adjusts the view and looks again in loops.">
  <defs>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="370" fill="#ffffff"/>

  <!-- 1. Collect & store -->
  <rect x="30" y="66" width="204" height="140" rx="14" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
  <text x="132" y="102" font-size="18" font-weight="700" fill="#0d47a1" text-anchor="middle">1. Collect &amp; store</text>
  <text x="132" y="132" font-size="13" fill="#42586e" text-anchor="middle">raw data, complete with</text>
  <text x="132" y="150" font-size="13" fill="#42586e" text-anchor="middle">its gaps and origins</text>
  <text x="132" y="180" font-size="12" font-style="italic" fill="#5b7288" text-anchor="middle">(everything from Module 6)</text>

  <line x1="234" y1="136" x2="272" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#arrowP)"/>

  <!-- 2. Transform -->
  <rect x="280" y="66" width="204" height="140" rx="14" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="382" y="102" font-size="18" font-weight="700" fill="#1b5e20" text-anchor="middle">2. Transform</text>
  <text x="382" y="132" font-size="13" fill="#3f5747" text-anchor="middle">clean, filter, aggregate;</text>
  <text x="382" y="150" font-size="13" fill="#3f5747" text-anchor="middle">choose a subset to view</text>
  <text x="382" y="180" font-size="12" font-style="italic" fill="#587a5e" text-anchor="middle">(exploration = changing it)</text>

  <line x1="484" y1="136" x2="522" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#arrowP)"/>

  <!-- 3. Map to visuals -->
  <rect x="530" y="66" width="204" height="140" rx="14" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
  <text x="632" y="102" font-size="18" font-weight="700" fill="#e65100" text-anchor="middle">3. Map to visuals</text>
  <text x="632" y="132" font-size="13" fill="#6b503a" text-anchor="middle">bars, points, lines, colors &#8212;</text>
  <text x="632" y="150" font-size="13" fill="#6b503a" text-anchor="middle">every choice is an argument</text>
  <text x="632" y="180" font-size="12" font-style="italic" fill="#8a6a4a" text-anchor="middle">(about what matters)</text>

  <line x1="734" y1="136" x2="772" y2="136" stroke="#64748b" stroke-width="2" marker-end="url(#arrowP)"/>

  <!-- 4. Human perceives -->
  <rect x="780" y="66" width="150" height="140" rx="14" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <g transform="translate(855,105)" stroke="#6a1b9a" stroke-width="2.5" fill="none">
    <path d="M -26 0 Q 0 -20 26 0 Q 0 20 -26 0 Z"/>
    <circle cx="0" cy="0" r="7"/>
  </g>
  <text x="855" y="154" font-size="17" font-weight="700" fill="#4a148c" text-anchor="middle">4. A human</text>
  <text x="855" y="173" font-size="17" font-weight="700" fill="#4a148c" text-anchor="middle">perceives</text>
  <text x="855" y="194" font-size="12" fill="#54405c" text-anchor="middle">the final component</text>

  <!-- feedback loops -->
  <path d="M 855 206 V 290 H 632 V 214" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowP)"/>
  <path d="M 780 290 H 382 V 214" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrowP)"/>
  <text x="509" y="318" font-size="12.5" font-style="italic" fill="#64748b" text-anchor="middle">the loops: notice something odd, adjust the view or the subset, look again &#8212;</text>
  <text x="509" y="336" font-size="12.5" font-style="italic" fill="#64748b" text-anchor="middle">if your first chart is your final chart, you skipped the best part</text>
</svg>
